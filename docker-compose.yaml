version: "3.8"

services:
  php:
    build:
      context: .
    container_name: symfony_php

    networks:
      - symfony

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - symfony

networks:
  symfony:
    driver: bridge
